
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: ${CHRONOS_DOCKER_DB_PASSWORD:?Set CHRONOS_DOCKER_DB_PASSWORD in .env}
      POSTGRES_DB: chronos
    ports:
      - "5433:5432"
    volumes:
      - chronos_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init/01-init-chronos.sh:/docker-entrypoint-initdb.d/01-init-chronos.sh:ro
      - ./chronos_schema.sql:/schema/chronos_schema.sql:ro
      - ./database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chronos:v10
    environment:
      CHRONOS_DATABASE_URL: postgres://chronos:${CHRONOS_DOCKER_DB_PASSWORD_URLENCODED}@db:5432/chronos?sslmode=disable  
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chronos_postgres_data:
