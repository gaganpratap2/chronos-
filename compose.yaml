
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: ${CHRONOS_DOCKER_DB_PASSWORD:?Set CHRONOS_DOCKER_DB_PASSWORD in .env}
      POSTGRES_DB: chronos
    ports:
      - "5433:5432"
    volumes:
      - chronos_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init/01-init-chronos.sh:/docker-entrypoint-initdb.d/01-init-chronos.sh:ro
      - ./chronos_schema.sql:/schema/chronos_schema.sql:ro
      - ./database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chronos:v11
    environment:
      CHRONOS_DATABASE_URL: postgres://chronos:${CHRONOS_DOCKER_DB_PASSWORD_URLENCODED}@db:5432/chronos?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - chronos_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - chronos_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  chronos_postgres_data:
  chronos_prometheus_data:
  chronos_grafana_data:
